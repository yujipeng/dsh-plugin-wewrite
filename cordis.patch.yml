# dsh-plugin-wewrite 的 bundle 补丁层：单节点 insert。
# 补丁按整项替换处理（不深合并），本行即该插件的完整配置。
# 默认只启用写作，不启用真实推送：pushEnabled=false、publishTransport=fake。
- insert:
    - id: wewrite-python
      name: dsh-plugin-wewrite
      config:
        agentToolsEnabled: true
        pushEnabled: false
        publishTransport: fake
        bridgeTimeoutMs: 30000
